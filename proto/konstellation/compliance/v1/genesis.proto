syntax = "proto3";
package konstellation.compliance.v1;

import "gogoproto/gogo.proto";
import "konstellation/compliance/v1/compliance.proto";

option go_package = "github.com/Konstellation-Network/konstellation/x/compliance/types";

// GenesisState is the module's genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated ListEntry entries = 2 [(gogoproto.nullable) = false];
  repeated PendingUpdate pending = 3 [(gogoproto.nullable) = false];
  // next_pending_id is the id the next scheduled update gets.
  uint64 next_pending_id = 4;
  repeated Cooldown cooldowns = 5 [(gogoproto.nullable) = false];
}

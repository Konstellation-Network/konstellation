syntax = "proto3";
package konstellation.compliance.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Konstellation-Network/konstellation/x/compliance/types";

// List identifies one of the two compliance lists.
enum List {
  option (gogoproto.goproto_enum_prefix) = false;
  // LIST_UNSPECIFIED is invalid.
  LIST_UNSPECIFIED = 0;
  // LIST_ALLOW is the "verified" list. Never enforced by the chain; exposed to
  // contracts through the precompile so they can opt in.
  LIST_ALLOW = 1;
  // LIST_BLOCK is the "frozen" list. Enforced chain-wide by the ante handler:
  // no transaction signed by, paying for, or directly transferring to a listed
  // address is accepted.
  LIST_BLOCK = 2;
}

// Action is what a Change does to a list.
enum Action {
  option (gogoproto.goproto_enum_prefix) = false;
  // ACTION_UNSPECIFIED is invalid.
  ACTION_UNSPECIFIED = 0;
  // ACTION_ADD adds the address to the list.
  ACTION_ADD = 1;
  // ACTION_REMOVE removes the address from the list.
  ACTION_REMOVE = 2;
}

// Params are the module parameters. All changes are governance-only.
message Params {
  option (gogoproto.equal) = true;

  // authority is the address (bech32) allowed to schedule updates and to
  // emergency-freeze. Empty means no such authority exists and only
  // governance can change the lists. Intended to be a foundation multisig.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // timelock is the delay between an authority scheduling a change and the
  // change taking effect, and the lifetime of an emergency freeze that is not
  // ratified. Also the notice period a scheduled change can be cancelled in.
  google.protobuf.Duration timelock = 2 [(gogoproto.stdduration) = true, (gogoproto.nullable) = false];
  // allowlist_add_timelock is the delay for adding an address to the allow
  // list only. Kept separate because it gates onboarding latency, not safety.
  google.protobuf.Duration allowlist_add_timelock = 3 [(gogoproto.stdduration) = true, (gogoproto.nullable) = false];
  // enforce switches the ante-handler check on and off. Governance kill
  // switch; the lists and the precompile keep working when it is off.
  bool enforce = 4;
}

// ListEntry is one address on one list.
message ListEntry {
  // address in bech32.
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  List list = 2;
  // added_at is the block time the entry took effect.
  google.protobuf.Timestamp added_at = 3 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  // expires_at is set only for an emergency freeze: the block time after
  // which the entry is dropped unless a permanent entry replaced it. Nil is
  // permanent.
  google.protobuf.Timestamp expires_at = 4 [(gogoproto.stdtime) = true, (gogoproto.nullable) = true];
  // reason is the public justification recorded with the entry.
  string reason = 5;
}

// Change is one add/remove on one list, the unit of a scheduled update.
message Change {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  List list = 2;
  Action action = 3;
  string reason = 4;
}

// PendingUpdate is a scheduled set of changes waiting out its timelock.
message PendingUpdate {
  uint64 id = 1;
  repeated Change changes = 2 [(gogoproto.nullable) = false];
  // execute_at is the block time at or after which EndBlock applies it.
  google.protobuf.Timestamp execute_at = 3 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  // scheduled_by is the authority that scheduled it.
  string scheduled_by = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // extended lists the emergency freezes that scheduling this update pushed
  // out to execute_at (a scheduled permanent block ratifies a live emergency
  // freeze). Cancelling the update restores each to its original expiry, so
  // schedule-then-cancel cannot keep an address frozen past one timelock.
  repeated ExtendedFreeze extended = 5 [(gogoproto.nullable) = false];
}

// ExtendedFreeze records the expiry an emergency freeze had before a
// scheduled update extended it.
message ExtendedFreeze {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp original_expires_at = 2 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  // frozen_at is the added_at of the freeze that was extended. A freeze
  // removed by governance and re-applied while the update is pending is a
  // different freeze; the record must not act on it.
  google.protobuf.Timestamp frozen_at = 3 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}

// Cooldown records that an address may not be emergency-frozen again before
// `until`: one timelock after its last emergency freeze lapsed or was lifted.
message Cooldown {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // until is a unix time in seconds.
  int64 until = 2;
}

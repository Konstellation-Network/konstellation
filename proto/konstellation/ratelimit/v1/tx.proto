syntax = "proto3";
package konstellation.ratelimit.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";

option go_package = "github.com/Konstellation-Network/konstellation/x/ratelimit/types";

// Msg is the rate-limit transaction service. Every message is governance
// only: limits change through proposals. The emergency lever is elsewhere —
// the circuit breaker can disable MsgTransfer outright, immediately.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // AddRateLimit creates a limit on a path that has none.
  rpc AddRateLimit(MsgAddRateLimit) returns (MsgAddRateLimitResponse);
  // UpdateRateLimit replaces the quota on an existing path and starts a
  // fresh window.
  rpc UpdateRateLimit(MsgUpdateRateLimit) returns (MsgUpdateRateLimitResponse);
  // RemoveRateLimit deletes a limit.
  rpc RemoveRateLimit(MsgRemoveRateLimit) returns (MsgRemoveRateLimitResponse);
  // ResetRateLimit zeroes a path's flow and starts a fresh window.
  rpc ResetRateLimit(MsgResetRateLimit) returns (MsgResetRateLimitResponse);
}

message MsgAddRateLimit {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kons/ratelimit/MsgAddRateLimit";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  string channel_id = 3;
  string max_percent_send = 4 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string max_percent_recv = 5 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  uint64 duration_hours = 6;
  // Optional absolute caps in base units; 0 or unset means none (Quota).
  string max_absolute_send = 7 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string max_absolute_recv = 8 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
}

message MsgAddRateLimitResponse {}

message MsgUpdateRateLimit {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kons/ratelimit/MsgUpdateRateLimit";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  string channel_id = 3;
  string max_percent_send = 4 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string max_percent_recv = 5 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  uint64 duration_hours = 6;
  // Optional absolute caps in base units; 0 or unset means none (Quota).
  string max_absolute_send = 7 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string max_absolute_recv = 8 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
}

message MsgUpdateRateLimitResponse {}

message MsgRemoveRateLimit {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kons/ratelimit/MsgRemoveRateLimit";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  string channel_id = 3;
}

message MsgRemoveRateLimitResponse {}

message MsgResetRateLimit {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kons/ratelimit/MsgResetRateLimit";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 2;
  string channel_id = 3;
}

message MsgResetRateLimitResponse {}

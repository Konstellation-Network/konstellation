syntax = "proto3";
package konstellation.ratelimit.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Konstellation-Network/konstellation/x/ratelimit/types";

// Path identifies what a rate limit applies to: one denom over one channel
// (IBC v1) or client (IBC v2).
message Path {
  // denom as it exists on this chain: the base denom for native tokens,
  // the ibc/<hash> voucher denom for tokens that came in over IBC.
  string denom = 1;
  // channel_id is the local channel (v1) or client (v2) id.
  string channel_id = 2;
}

// Quota is the limit. Thresholds are a percentage of the denom's total
// supply on this chain, snapshotted when the window starts (Flow.channel_value).
message Quota {
  // max_percent_send caps net outflow over the window. 0 blocks all sends.
  string max_percent_send = 1 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // max_percent_recv caps net inflow over the window. 0 blocks all receives.
  string max_percent_recv = 2 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // duration_hours is the window length.
  uint64 duration_hours = 3;
}

// Flow is the running total for the current window.
message Flow {
  // inflow received over this path in the current window.
  string inflow = 1 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // outflow sent over this path in the current window.
  string outflow = 2 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // channel_value is the denom's total supply when the window started; the
  // denominator for the percentage thresholds. Fixed for the window.
  string channel_value = 3 [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // window_start is the block time the current window began. The window
  // resets in BeginBlock once block time reaches window_start + duration.
  google.protobuf.Timestamp window_start = 4 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}

// RateLimit is one path's quota and current flow.
message RateLimit {
  Path path = 1 [(gogoproto.nullable) = false];
  Quota quota = 2 [(gogoproto.nullable) = false];
  Flow flow = 3 [(gogoproto.nullable) = false];
}

// PendingPacket is a send counted against the current window that has not
// been acknowledged yet. An error ack or a timeout in the same window puts
// the amount back; the window reset drops these so a late failure cannot
// credit a later window.
message PendingPacket {
  string channel_id = 1;
  string denom = 2;
  uint64 sequence = 3;
}

# ENGINEERING.md §4.3: govulncheck on every PR and nightly.
#
# PR:      scan the built binary (-mode=binary). Fast, and it scans exactly
#          what ships. Built with nostrip so symbol-level analysis works.
# Both go through scripts/vulncheck.sh, which fails on any reachable finding
# not justified in .govulncheck-allowlist.
# Nightly: full source scan (./...). Slower, catches advisories against
#          code nobody touched, and reports reachable call traces.
name: vuln
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vulncheck-binary COSMOS_BUILD_OPTIONS=nostrip

  source:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vulncheck 2>&1 | tee vulncheck.log
      # A red nightly run that nobody reads is the failure mode §4.3 warns
      # about. Turn it into an issue someone owns.
      - name: Open an issue on failure
        if: failure()
        run: |
          title="nightly govulncheck failing (ENGINEERING.md §4.3)"
          if [ -z "$(gh issue list --label vulncheck --state open --json number,title --jq --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')" ]; then
            gh label create vulncheck --color B60205 --description "Nightly govulncheck failure (ENGINEERING.md §4.3)" 2>/dev/null || true
            {
              echo "Failed on $(date -u +%Y-%m-%d)."
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo '```'
              tail -60 vulncheck.log 2>/dev/null || echo "(vulncheck.log not found — the failure happened before the scan ran, e.g. checkout, setup-go, or govulncheck install)"
              echo '```'
              echo
              echo "Bump the dependency, or add a justified entry to .govulncheck-allowlist and ENGINEERING.md §4.1.1."
            } > body.md
            gh issue create --title "$title" --label vulncheck --body-file body.md
          fi

# ENGINEERING.md §4.2 / §17: watch cosmos/evm releases.
# Daily: if upstream has a tag newer than go.mod's pin, open one issue per
# release (label upstream-release) with the review brief from
# scripts/upstream-check.sh. Idempotent: re-runs update the existing issue,
# reopening it if it was closed. If the watcher itself breaks, it opens a
# separate upstream-watch-failure issue so that doesn't go unnoticed either.
name: upstream-watch
on:
  schedule:
    - cron: "23 */6 * * *"   # four times a day; §4.2 target is 24h from tag to ready
  workflow_dispatch:

concurrency:
  group: upstream-watch

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare pinned cosmos/evm with upstream
        id: check
        run: |
          set +e
          scripts/upstream-check.sh > brief.md 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat brief.md
          [ "$code" = 0 ] || [ "$code" = 10 ]
      - name: Open or update the review issue
        if: steps.check.outputs.code == '10'
        run: |
          title="cosmos/evm ${{ steps.check.outputs.latest }} released — review required (§4.2)"
          scripts/gh-upsert-issue.sh upstream-release \
            "New cosmos/evm tag; review per ENGINEERING.md §4.2" \
            "$title" brief.md
      - name: Open an issue if the watcher itself is broken
        if: failure() || cancelled()
        run: |
          scripts/gh-failure-body.sh \
            "cosmos/evm release tracking may be silently stalled until this is fixed." \
            brief.md > watch-failure.md
          scripts/gh-upsert-issue.sh upstream-watch-failure \
            "upstream-watch.yml is failing; releases may go unnoticed (ENGINEERING.md §17)" \
            "upstream-watch is failing (ENGINEERING.md §17)" watch-failure.md

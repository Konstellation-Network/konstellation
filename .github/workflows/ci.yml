name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The hosted runner has ~14 GB free; this module cache plus a CGO build
      # cache plus the build itself no longer fit (2026-09-20: "No space
      # left on device" at link). Drop preinstalled toolchains nothing here
      # uses (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8" # go.mod's `toolchain`; setup-go reads only its `go` line and would download it twice
          cache: true
      - name: Dependency policy (ENGINEERING.md §2.2, §2.3)
        run: make verify-deps
      - name: Build
        run: make build
      - name: Unit tests
        run: make test-unit
      - name: Integration tests
        run: make test-integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8" # as above; tests/e2e/go.mod carries the same toolchain line
          cache-dependency-path: tests/e2e/go.sum
      - name: Build node image
        run: make docker-build
      - name: End-to-end (interchaintest)
        run: make test-e2e

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The hosted runner has ~14 GB free; this module cache plus a CGO build
      # cache plus the build itself no longer fit (2026-09-20: "No space
      # left on device" at link). Drop preinstalled toolchains nothing here
      # uses (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8" # go.mod's `toolchain`; setup-go reads only its `go` line and would download it twice
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1 # keep in step with .golangci.yml; bump deliberately
          args: --timeout 10m
      - uses: golangci/golangci-lint-action@v8
        name: Lint tests/e2e (separate module)
        with:
          version: v2.13.1
          working-directory: tests/e2e
          args: --timeout 10m --config ../../.golangci.yml
